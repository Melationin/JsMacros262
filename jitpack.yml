# JitPack build config: publish only the jsm-api artifact.
# Note: use the raw.githubusercontent.com URL - the github.com/.../raw/ form
# 404s, which silently broke JDK installation before.
before_install:
  - wget -q https://raw.githubusercontent.com/sormuras/bach/master/install-jdk.sh
  - source install-jdk.sh --feature 21

# install-jdk.sh installs to $HOME/jdk-21 and exports JAVA_HOME in this shell;
# re-export explicitly as a fallback and print the version for diagnostics.
install:
  - export JAVA_HOME="${HOME}/jdk-21"
  - export PATH="${JAVA_HOME}/bin:${PATH}"
  - java -version
  - ./gradlew :jsm-api:assemble
