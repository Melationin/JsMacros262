# JitPack build config: publish only the jsm-api artifact.
# The API targets Java 21, so use the matching Temurin JDK for publication.
before_install:
  - source "$HOME/.sdkman/bin/sdkman-init.sh"
  - sdk install java 21.0.4-tem
  - sdk use java 21.0.4-tem

# publishToMavenLocal (not assemble): JitPack publishes by locating pom.xml
# in build/ or ~/.m2, and assemble produces no pom, so no artifacts get
# published otherwise ("No build artifacts found").
install:
  - export JAVA_HOME="$HOME/.sdkman/candidates/java/21.0.4-tem"
  - export PATH="$JAVA_HOME/bin:$PATH"
  - java -version
  - ./gradlew :jsm-api:publishToMavenLocal -PapiOnly
