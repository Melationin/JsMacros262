name: Build Release

# Builds the release artifacts when a GitHub release is created and attaches
# them to the release.

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out JS backend
        uses: actions/checkout@v4
        with:
          repository: Melationin/JS-backend
          path: js-backend

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release artifacts
        run: |
          ./gradlew -p js-backend :graaljs:shadowJar
          ./gradlew build -x test -PjsBackendDir=js-backend

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            jsm-api/build/libs/*.jar
            js-backend/graaljs/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
