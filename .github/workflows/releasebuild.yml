on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      GITHUB_REF:
        required: true
        type: string
      upload_docs:
        required: true
        type: boolean
    secrets:
      CF_API_KEY:
        required: true
      MODRINTH_TOKEN:
        required: true
      PYPI_API_TOKEN:
        required: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Check out JS backend
        uses: actions/checkout@v4
        with:
          repository: Melationin/JS-backend
          path: js-backend

      - name: Get Artifact Id
        uses: actions/github-script@v7
        id: artifact_id
        env:
          branch: '${{ inputs.branch }}'
        with:
          result-encoding: string
          script: |
            // use env branch replace / with _
            return process.env.branch.replace(/\//g, '_')

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build
        run: |
          ./gradlew -p js-backend :graaljs:shadowJar
          ./gradlew build -PjsBackendDir=js-backend

      - name: Upload To Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_id.outputs.result }}
          path: |
            ./dist/**/*
            ./gradle.properties
            ./gradle/libs.versions.toml
            ./js-backend/graaljs/build/libs/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Get Artifact Id
        uses: actions/github-script@v7
        id: artifact_id
        env:
          branch: '${{ inputs.branch }}'
        with:
          result-encoding: string
          script: |
            // use env branch replace / with _
            return process.env.branch.replace(/\//g, '_')

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_id.outputs.result }}

      - name: Load build versions
        uses: actions/github-script@v7
        id: build_versions
        with:
          script: |
            const fs = require("fs");
            const versions = fs.readFileSync("./gradle/libs.versions.toml", "utf8");
            const readVersion = (name) => {
              const match = versions.match(new RegExp(`^${name}\\s*=\\s*"([^"]+)"`, "m"));
              if (!match) throw new Error(`Missing ${name} in gradle/libs.versions.toml`);
              return match[1];
            };
            core.setOutput("java", readVersion("java"));
            core.setOutput("minecraft", readVersion("minecraft"));

      - name: Check For Fabric Jar
        uses: actions/github-script@v5
        id: fabric_release
        with:
          result-encoding: string
          script: |
            const fs = require("fs")
            return fs.readdirSync("./dist/").find(e => e.startsWith("jsmacrosplus-") && e.endsWith(".jar")) || false;

      - name: Zip TS
        uses: vimtor/action-zip@v1
        with:
          files: dist/typescript/
          dest: dist/typescript-${{ steps.artifact_id.outputs.result }}.zip

      - name: Upload TS to Git Release
        uses: JasonEtco/upload-to-release@master
        with:
          args: ./dist/typescript-${{ steps.artifact_id.outputs.result }}.zip application/jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Version Number
        uses: actions/github-script@v5
        id: version_num
        env:
          REF: '${{ inputs.GITHUB_REF }}'
        with:
          result-encoding: string
          script: |
            return process.env.REF.replace(/\/?refs\/tags\//, '')

      - name: Run Publish Fabric
        if: ${{ steps.fabric_release.outputs.result != 'false' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: 3wGWhm8A
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false
          modrinth-unfeature-mode: any

          curseforge-id: 403185
          curseforge-token: ${{ secrets.CF_API_KEY }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: ${{ steps.fabric_release.outputs.result }}
          version: ${{ steps.version_num.outputs.result }}

          files: ./dist/${{ steps.fabric_release.outputs.result }}
          version-type: release

          loaders: fabric
          game-versions: ${{ steps.build_versions.outputs.minecraft }}

          java: ${{ steps.build_versions.outputs.java }}
          retry-attempts: 5
          retry-delay: 60000
          fail-mode: skip

  upload_pydoc:
    if: ${{ inputs.upload_docs }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Get Artifact Id
        uses: actions/github-script@v5
        id: artifact_id
        env:
          branch: '${{ inputs.branch }}'
        with:
          result-encoding: string
          script: |
            // use env branch replace / with _
            return process.env.branch.replace(/\//g, '_')      

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_id.outputs.result }}

      - name: Install Python
        uses: actions/setup-python@v1
        with:
          python-version: 3.7

      - name: Install Python Deps
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine

      - name: Upload PyDoc
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd dist/python
          python setup.py sdist bdist_wheel
          twine upload dist/*
