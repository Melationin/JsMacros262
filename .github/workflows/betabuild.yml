# Continuous build on every push. Produces beta jars (version suffixed with
# -beta-<sha>) as a downloadable artifact.

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        id: fname
        with:
          result-encoding: string
          script: |
            const fs = require("fs");
            let file = fs.readFileSync("./gradle.properties");
            file = file.toString().split("\n").map(e => e.trim().startsWith("mod_version") ? `${e}-beta-${process.env.GITHUB_SHA.substring(0, 7)}` : e).join("\n");
            fs.writeFileSync("./gradle.properties", file);
            const mod_version = file.toString().split("\n").filter(e => e.trim().startsWith("mod_version"))[0].split("=")[1].trim();
            const archives_base_name = file.toString().split("\n").filter(e => e.trim().startsWith("archives_base_name"))[0].split("=")[1].trim();
            return `${archives_base_name}-${mod_version}`;

      - name: Zip source code
        run: |
          mkdir -p dist
          zip -r "./dist/${{ steps.fname.outputs.result }}-source.zip" . -x ".git/*"

      # Gradle 8.14.4 does not support JDK 25/26 as the daemon JVM (its Kotlin
      # DSL compiler crashes parsing e.g. "25.0.4"), so the daemon runs on 21...
      - name: Set up JDK 21 (Gradle daemon JVM)
        id: jdk21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      # ...while the compile toolchain (java = 25 in gradle/libs.versions.toml)
      # is pre-installed here so Gradle does not need foojay auto-download on CI.
      - name: Set up JDK 25 (compile toolchain)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run build with Gradle wrapper
        env:
          JAVA_HOME: ${{ steps.jdk21.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew remapFabricJar :jsm-api:jar -x test -Porg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }}

      - name: Bundle jars and source code
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fname.outputs.result }}
          path: |
            ./dist/*-source.zip
            ./build/libs/*.jar
            ./jsm-api/build/libs/*.jar
